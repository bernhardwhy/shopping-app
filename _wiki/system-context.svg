<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title description">
  <title id="title">Shopping List App system context</title>
  <desc id="description">A shopper manages a grocery list in the Shopping List App, which reads and writes grocery items in Firebase Realtime Database.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#666"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 12; }
      .label { font: 600 18px Arial, sans-serif; fill: #1f1f1f; text-anchor: middle; }
      .type { font: 14px Arial, sans-serif; fill: #444; text-anchor: middle; }
      .relation { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .relation-label { font: 14px Arial, sans-serif; fill: #333; text-anchor: middle; }
    </style>
  </defs>
  <rect x="60" y="180" width="190" height="90" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="155" y="216" class="label">Shopper</text>
  <text x="155" y="242" class="type">[Person]</text>

  <rect x="430" y="160" width="250" height="130" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="555" y="211" class="label">Shopping List App</text>
  <text x="555" y="239" class="type">[Software System]</text>

  <rect x="830" y="170" width="220" height="110" class="box" fill="#f5f5f5" stroke="#666"/>
  <text x="940" y="210" class="label">Firebase Realtime</text>
  <text x="940" y="233" class="label">Database</text>
  <text x="940" y="258" class="type">[Software System]</text>

  <path d="M250 225 H420" class="relation"/>
  <text x="335" y="206" class="relation-label">Manages grocery list</text>
  <path d="M680 225 H820" class="relation"/>
  <text x="750" y="196" class="relation-label">Reads and writes</text>
  <text x="750" y="214" class="relation-label">grocery items</text>
</svg>
